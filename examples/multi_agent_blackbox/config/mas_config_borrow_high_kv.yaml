agents:
  agent_1:
    system_prompt: Produce a detailed plan. Keep writing until the token budget is exhausted.
    max_tokens: 10240
    ignore_eos: true
  agent_2:
    system_prompt: Summarize the execution of the plan concisely within the token budget.
    max_tokens: 512
    ignore_eos: true
  agent_3:
    system_prompt: Verify the previous outputs in detail, then give the final answer.
    max_tokens: 4096
    ignore_eos: true
