# Starter multi-agent blackbox training config.
#
# The outer config selects one verl PPO trainer base shared by all policies;
# each policy then applies its own overrides before constructing its v1 PPOTrainer.
#
# ── 模型路径（必须提供）───────────────────────────────────────────────
# 每个 policy 的 model.path 在 policies.*.ppo_trainer_overrides 里是 ???，
# 必须通过 hydra override 提供（不会静默回退到 verl 默认模型）：
#   policies.policy_1.ppo_trainer_overrides.actor_rollout_ref.model.path=/path/to/model1
#   policies.policy_2.ppo_trainer_overrides.actor_rollout_ref.model.path=/path/to/model2
# 数据文件同理（data.train_files / data.val_files 是 ???）。

# Runtime patch applied before trainer construction.
example_patch_fqn: examples.multi_agent_blackbox.verl_patch

# Hydra config module that provides verl's trainer configs (ppo_trainer, ppo_megatron_trainer).
ppo_trainer_config_source: verl.trainer.config
# verl Hydra config shared by every policy. Policy entries select differences
# through ppo_trainer_overrides and cannot replace this trainer base.
ppo_trainer_config_name: ppo_trainer

data:
  train_files: ???
  val_files: ???
  train_batch_size: 32
  val_batch_size: 64
  return_raw_chat: true
  trust_remote_code: true
  dataloader_num_workers: 4
  # Required by verl create_rl_sampler (reads data_config.shuffle); keep it.
  shuffle: true
  # Prompt filtering lengths for the single shared dataloader.
  max_prompt_length: 4096
  max_response_length: 32768

algorithm:
  adv_estimator: grpo
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false
  # DAPO group filtering; keep null unless the reward path writes a non-sparse
  # metric into reward_extra_info (current reward only returns score).
  filter_groups: null

# Rollout-failure handling: enable sync_refill_failed_groups once the external
# MAS can occasionally fail a rollout (failed groups are evicted and refilled
# with fresh prompts). Refill goes through the outer trainer, so toggling here
# is safe.
sampler:
  max_off_policy_threshold: 8
  max_off_policy_strategy: drop
  sampler_kwargs: {}
  sync_refill_failed_groups: false

# SkipManager config consumed by MultiAgentsPPOTrainer.on_train_begin. Not used yet.
skip:
  rollout_tq:
    enable: false

reward:
  # Number of reward workers per policy (verl default; two policies -> 16
  # total, all aggregated into the framework's scoring pool).
  num_workers: 8
  custom_reward_function:
    path: pkg://examples/multi_agent_blackbox.reward
    name: compute_score

trainer:
  project_name: uni_marl
  experiment_name: uni_marl_blackbox_grpo
  total_training_steps: 100
  val_before_train: false
  val_only: false
  test_freq: 5
  resume_mode: disable
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  resume_from_path: null
  default_hdfs_dir: null
  del_local_ckpt_after_load: false
  save_freq: -1
  # Metrics sink used by the outer trainer only (per-policy trainers don't run fit()).
  logger: ["console"]
  v1:
    # v1 trainer mode: "separate_async" (decoupled rollout/train, async) or "sync".
    trainer_mode: separate_async
    separate_async:
      # Async warmup batches pre-filled into TQ before the loop starts.
      num_warmup_batches: 8
      # One rollout-weight sync cycle contains this many local PPO updates.
      # Must satisfy train_batch_size == parameter_sync_step * each policy's
      # actor_rollout_ref.actor.ppo_mini_batch_size.
      parameter_sync_step: 1

# TransferQueue (verl): KV queue bridging rollout <-> train; enable=true is
# required by the v1 async path. Keep SimpleStorage (in-process); MooncakeStore
# is only for cross-node distributed storage and is unused here.
transfer_queue:
  enable: true
  metrics:
    enabled: false
    port: 0
  backend:
    storage_backend: SimpleStorage
    SimpleStorage:
      total_storage_size: 100000
      num_data_storage_units: 8
    MooncakeStore:
      auto_init: false
      metadata_server: localhost:50123
      master_server_address: localhost:50124
      local_hostname: localhost
      protocol: tcp
      global_segment_size: 4294967296
      local_buffer_size: 1073741824
      device_name: ""

ray_kwargs:
  ray_init:
    # Ray CPU count; null = auto-detect (set a fixed number when using SLURM).
    num_cpus: null
    runtime_env:
      # Applies the example patch inside every Ray worker (per-policy unique
      # Ray names); required for multi-policy sharing on one cluster.
      worker_process_setup_hook: examples.multi_agent_blackbox.verl_patch.apply_worker_patch
  # Set a path to dump a Ray timeline for profiling; null = disabled.
  timeline_json_file: null

# Shared actor/rollout/framework wiring. Values projected into per-policy
# configs below are the single source of truth; agent/custom.* are consumed by
# the outer trainer only.
actor_rollout_ref:
  actor:
    # Kept explicit to mirror v1 separate_async's configuration-and-assertion
    # contract. It must satisfy data.train_batch_size ==
    # trainer.v1.separate_async.parameter_sync_step * this value.
    ppo_mini_batch_size: 32
  rollout:
    # GRPO group size: rollouts per prompt, shared by all policies (interpolated below).
    n: 4
    val_kwargs:
      n: 1
      do_sample: false
    # Temperature is per-policy (policies.*.ppo_trainer_overrides.actor_rollout_ref
    # .rollout.temperature); the runner does not send it, so sampling uses each
    # policy's vLLM generation config, matching the log-prob recompute.

    agent:
      # Extension-point contract for the agent loop manager class.
      agent_loop_manager_class: uni_agent.trainer.framework.entry.AgentFrameworkRolloutAdapter

    custom:
      agent_framework:
        # Framework implementation driving the external multi-agent blackbox.
        framework_class_fqn: examples.multi_agent_blackbox.framework.RemoteMultiAgentFramework
        # Blackbox MAS client run once per prompt/rollout (role-gateway calls).
        multi_agent_runner_fqn: examples.multi_agent_blackbox.multi_agent_runner.multi_agent_runner
        # Number of gateway actors serving the LLM sessions.
        gateway_count: 8
        # Seconds to wait for a rollout batch to finish before failing it.
        completion_timeout_seconds: 600
        # Cap on concurrent in-flight rollouts (semaphore).
        max_concurrent_rollouts: 32
        multi_agent_runner_kwargs:
          # MAS topology/system-prompt config loaded by the runner.
          mas_config_path: examples/multi_agent_blackbox/config/mas_config_long.yaml
          # Default max_tokens per LLM call (agent_cfg in mas_config can override).
          max_tokens: 4096
          # Per-HTTP-request timeout inside the runner.
          request_timeout_seconds: 600
        # MAS role -> trainable policy attribution; the last role in this
        # ordering supplies the final result used for reward.
        role_policy_mapping:
          agent_1: policy_1
          agent_2: policy_1
          agent_3: policy_2

policies:
  # ── policies 字段所有权约定 ─────────────────────────────────────────
  # 未标注的字段 = per-policy 独立，可自由调整（每个 policy 可以不同）。
  # 标注"外层共享"的字段 = 顶层配置的投影，勿在此修改；要改请改顶层。
  # ⚠️ algorithm.* 不要改成字面值——合并 advantage 计算只读 policy_1 的配置，
  #    per-policy 分叉当前不支持（会静默不一致）。
  # 完整字段修改指南见 examples/multi_agent_blackbox/README.md。
  policy_1:
    ppo_trainer_overrides:
      trainer:
        nnodes: 2
        n_gpus_per_node: 8
        default_local_dir: checkpoints/multi_agent_blackbox/policy_1
        total_training_steps: ${trainer.total_training_steps}  # 外层共享，改顶层

      data:
        train_batch_size: ${data.train_batch_size}             # 外层共享，改顶层

      actor_rollout_ref:
        hybrid_engine: true
        model:
          path: ???                                            # 必须 hydra override 提供（见文件头）
          trust_remote_code: true

        actor:
          strategy: fsdp
          use_dynamic_bsz: true
          ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}  # outer shared
          ppo_max_token_len_per_gpu: 40960
          use_kl_loss: false
          kl_loss_coef: 0.0
          optim:
            lr: 1e-6
            weight_decay: 0.01
          fsdp_config:
            fsdp_size: 8                                       # FSDP 分片数；须整除训练总卡数（nnodes×n_gpus_per_node）
            param_offload: true
            optimizer_offload: true

        rollout:
          name: vllm
          mode: async
          checkpoint_engine:
            backend: nccl
            # NCCL collective group name must be unique per policy (Ray derives
            # the detached NCCLUniqueIDStore actor name from the group key).
            engine_kwargs:
              nccl:
                group_name: checkpoint_policy_1
          n: ${actor_rollout_ref.rollout.n}
          # Standalone rollout replica allocation (separate_async): each replica
          # spans nnodes × n_gpus_per_node GPUs; launch scripts override per env.
          nnodes: 1
          n_gpus_per_node: 8
          # Per-policy sampling temperature == training-side recompute
          # temperature for this policy (fallback used by vLLM generation
          # config when the runner request carries no temperature).
          temperature: 1.0
          top_p: 1.0
          prompt_length: 4096
          response_length: 32768
          max_model_len: 36864
          load_format: safetensors
          tensor_model_parallel_size: 4                        # 须与 rollout 卡数匹配
          gpu_memory_utilization: 0.6
          calculate_log_probs: true
          enable_sleep_mode: true
          free_cache_engine: true
          multi_turn:
            format: qwen3_coder

  policy_2:
    # 结构与 policy_1 相同；字段所有权注释见 policy_1（下面同样适用）。
    ppo_trainer_overrides:
      trainer:
        nnodes: 2
        n_gpus_per_node: 8
        default_local_dir: checkpoints/multi_agent_blackbox/policy_2
        total_training_steps: ${trainer.total_training_steps}  # 外层共享，改顶层

      data:
        train_batch_size: ${data.train_batch_size}             # 外层共享，改顶层

      actor_rollout_ref:
        hybrid_engine: true
        model:
          path: ???                                            # 必须 hydra override 提供（见文件头）
          trust_remote_code: true

        actor:
          strategy: fsdp
          use_dynamic_bsz: true
          ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}  # outer shared
          ppo_max_token_len_per_gpu: 40960
          use_kl_loss: false
          kl_loss_coef: 0.0
          optim:
            lr: 1e-6
            weight_decay: 0.01
          fsdp_config:
            fsdp_size: 8                                       # FSDP 分片数；须整除训练总卡数（nnodes×n_gpus_per_node）
            param_offload: true
            optimizer_offload: true

        rollout:
          name: vllm
          mode: async
          checkpoint_engine:
            backend: nccl
            # Must be unique per policy (must differ from policy_1's value).
            engine_kwargs:
              nccl:
                group_name: checkpoint_policy_2
          n: ${actor_rollout_ref.rollout.n}
          # Standalone rollout replica allocation (separate_async): each replica
          # spans nnodes × n_gpus_per_node GPUs; launch scripts override per env.
          nnodes: 1
          n_gpus_per_node: 8
          # Per-policy sampling temperature == training-side recompute
          # temperature for this policy (fallback used by vLLM generation
          # config when the runner request carries no temperature).
          temperature: 1.0
          top_p: 1.0
          prompt_length: 4096
          response_length: 32768
          max_model_len: 36864
          load_format: safetensors
          tensor_model_parallel_size: 8                        # 须与 rollout 卡数匹配
          gpu_memory_utilization: 0.6
          calculate_log_probs: true
          enable_sleep_mode: true
          free_cache_engine: true
          multi_turn:
            format: hermes
