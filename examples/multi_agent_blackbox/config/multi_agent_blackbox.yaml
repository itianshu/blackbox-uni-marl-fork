# Starter multi-agent blackbox training config.
#
# Each policy root-composes verl's public PPO trainer config independently,
# then applies policy-specific overrides before constructing its v1 PPOTrainer.
#
# ── 模型路径（必须提供）───────────────────────────────────────────────
# 每个 policy 的 model.path 在 policies.*.ppo_trainer_overrides 里是 ???，
# 必须通过 hydra override 提供（不会静默回退到 verl 默认模型）：
#   policies.policy_1.ppo_trainer_overrides.actor_rollout_ref.model.path=/path/to/model1
#   policies.policy_2.ppo_trainer_overrides.actor_rollout_ref.model.path=/path/to/model2
# 数据文件同理（data.train_files / data.val_files 是 ???）。

# Runtime patch applied before trainer construction.
example_patch_fqn: examples.multi_agent_blackbox.verl_patch

# Hydra config module that provides verl's trainer configs (ppo_trainer, ppo_megatron_trainer).
ppo_trainer_config_source: verl.trainer.config

data:
  train_files: ???
  val_files: ???
  train_batch_size: 4
  val_batch_size: 4
  return_raw_chat: true
  trust_remote_code: true
  dataloader_num_workers: 4
  # Required by verl create_rl_sampler (reads data_config.shuffle); keep it.
  shuffle: true
  # Prompt filtering lengths for the single shared dataloader.
  max_prompt_length: 4096
  max_response_length: 32768

algorithm:
  adv_estimator: grpo
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false
  # DAPO group filtering; keep null unless the reward path writes a non-sparse
  # metric into reward_extra_info (current reward only returns score).
  filter_groups: null

# Rollout-failure handling: enable sync_refill_failed_groups once the external
# MAS can occasionally fail a rollout (failed groups are evicted and refilled
# with fresh prompts). Refill goes through the outer trainer, so toggling here
# is safe.
sampler:
  max_off_policy_threshold: 8
  max_off_policy_strategy: drop
  sampler_kwargs: {}
  sync_refill_failed_groups: false

# SkipManager config consumed by MultiAgentsPPOTrainer.on_train_begin. Not used yet.
skip:
  rollout_tq:
    enable: false

reward:
  # Number of reward workers per policy (verl default; two policies -> 16
  # total, all aggregated into the framework's scoring pool).
  num_workers: 8
  custom_reward_function:
    path: pkg://examples/multi_agent_blackbox.reward
    name: compute_score

trainer:
  project_name: uni_marl
  experiment_name: uni_marl_blackbox_grpo
  total_training_steps: 100
  resume_mode: disable
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  resume_from_path: null
  default_hdfs_dir: null
  del_local_ckpt_after_load: false
  save_freq: -1
  # Metrics sink used by the outer trainer only (per-policy trainers don't run fit()).
  logger: ["console"]
  v1:
    # v1 trainer mode: "separate_async" (decoupled rollout/train, async) or "sync".
    trainer_mode: separate_async
    separate_async:
      # Async warmup batches pre-filled into TQ before the loop starts.
      num_warmup_batches: 2
      # Keep 1 for the default profile (train_batch_size 4 == parameter_sync_step 1 * ppo_mini_batch_size 4).
      parameter_sync_step: 1

# TransferQueue (verl): KV queue bridging rollout <-> train; enable=true is
# required by the v1 async path. Keep SimpleStorage (in-process); MooncakeStore
# is only for cross-node distributed storage and is unused here.
transfer_queue:
  enable: true
  metrics:
    enabled: false
    port: 0
  backend:
    storage_backend: SimpleStorage
    SimpleStorage:
      total_storage_size: 100000
      num_data_storage_units: 8
    MooncakeStore:
      auto_init: false
      metadata_server: localhost:50123
      master_server_address: localhost:50124
      local_hostname: localhost
      protocol: tcp
      global_segment_size: 4294967296
      local_buffer_size: 1073741824
      device_name: ""

ray_kwargs:
  ray_init:
    # Ray CPU count; null = auto-detect (set a fixed number when using SLURM).
    num_cpus: null
    runtime_env:
      # Applies the example patch inside every Ray worker (per-policy unique
      # Ray names); required for multi-policy sharing on one cluster.
      # ⚠️ 启用 dynamic_inference_scheduling 时须切换为：
      #   worker_process_setup_hook: uni_agent.trainer.dynamic_inference.patch.apply_worker_patch
      # 该 hook 内部会先链式调用上面的 examples.multi_agent_blackbox.verl_patch.apply_worker_patch，
      # 再打 STANDALONE 引擎 sleep/wake 补丁（vLLM level-2 睡眠），二者叠加生效。
      worker_process_setup_hook: examples.multi_agent_blackbox.verl_patch.apply_worker_patch
  # Set a path to dump a Ray timeline for profiling; null = disabled.
  timeline_json_file: null

# ── 跨 policy 动态推理调度（replica 借用）────────────────────────────────
# 机制（RFC《多智能体动态推理调度》）：separate-async 模式下，每次完整 metrics
# 抓取后把低载 policy（home，借出方）的 standalone replica 借给瓶颈 policy
# （donor，借入方）——home 引擎 level-2 睡眠、唤醒预创建好的 guest 副本
# （donor 结构、dummy 权重）、定向推送一次 donor 最新权重、纳入 donor 的
# 负载均衡器。普通借还由 metrics 即时驱动；step boundary 只更新权重并刷新续借 guest。
#
# 前置条件（违反则启动时报错）：
#   - trainer.v1.trainer_mode 必须是 separate_async；
#   - home policy 至少 N+1 个 standalone replica（借 N 个仍留 ≥1 个服务）；
#   - 支持异构 N:M 折算，但须 N×home卡数=M×donor卡数；同节点卡优先归组，
#     聚合后的物理节点布局须能放置 donor replica；
#   - rollout: name=vllm、enable_sleep_mode=true、free_cache_engine=true、
#     checkpoint_engine.backend=nccl（本配置已满足）；
#   - borrowing.pairs 为空时，对任意数量 policy 自动生成 1:1 全有向图；
#     异构拓扑需显式声明 N:M 边。支持多入边/多出边，home worker slot 数
#     自动设置为 1 + out_degree(home)。
#
# enable: false 时零行为变化（外层 trainer 走原 on_step_end 路径）。
dynamic_inference_scheduling:
  enable: false
  # static = 只归还从不借用（安全降级模式）；resource = KV cache 利用率主信号
  # （vLLM /metrics 抓取，零埋点）。
  mode: resource

  # ── KV cache 利用率信号（主判定）────────────────────────────────
  resource_usage:
    kv_enter: 0.85                # KV 利用率（p90 of per-replica max，EMA）≥ 此值可判瓶颈
    kv_exit: 0.6                  # 瓶颈态退出阈值（非对称滞回）
    kv_post_lend_max: 0.7         # 须满足 kv_exit < 此值 < kv_enter，避免借后立即早归还
    kv_metric_names:              # /metrics 中 KV gauge 候选名（vLLM 版本相关，按序取首个命中）
      - kv_cache_usage_perc
      - gpu_cache_usage_perc
      - kv_cache_usage_ratio
    ema_alpha: 0.3                # KV 利用率 EMA 平滑；运行时滚动窗口约为 20 次抓取

  # ── 层 1：瓶颈确认 ─────────────────────────────────────────────
  bottleneck_confirm_polls: 10    # 连续 N 次完整 metrics 判定同一 policy 过载才借

  # ── 防抖：目标分配确认和动作稳定期 ────────────────────────────
  rebalance_confirm_polls: 2      # 同一目标分配连续出现 N 次完整 metrics 后立即执行
  rebalance_settle_polls: 3       # 物理借还后等待 N 次 poll，再参与普通再均衡
  min_lend_polls: 2               # 普通路径至少经过 N 次完整 metrics；安全早归还不受限制
  borrow_cooldown_s: 10.0         # 成功借出后 N 秒内禁止新增借卡；普通/安全归还仍可执行
  return_confirm_polls: 10        # donor EMA KV <= kv_exit 连续 N 次后尝试安全的部分归还

  # ── 提前归还（与借卡统一使用 KV 主信号）────────────────────────
  early_return_confirm_polls: 10  # home EMA KV >= kv_enter 连续 N 次后立即归还一个单元

  # ── 轮询与执行 ─────────────────────────────────────────────────
  poll_interval_s: 0.2            # LB 辅助指标轮询周期；不用于决定归还
  metrics_scrape_interval_s: 1.0  # vLLM /metrics 抓取周期
  borrow_drain_timeout_s: 10.0
  # patched = worker 侧 hook 打的 sleep/wake 补丁（默认）；
  # collective_rpc = 免补丁降级路径（仅 DP=1 时可用）。
  sleep_patch_mode: patched

  borrowing:
    # 空 = 对任意数量 policy 自动生成 1:1 全有序对（同构拓扑）。显式声明示例：
    #   pairs:
    #     # 2 个单节点 8 卡 home -> 1 个双节点 16 卡 donor guest
    #     - {home: policy_1, donor: policy_2,
    #        home_replicas_per_unit: 2, guest_replicas_per_unit: 1}
    #     # 反向：1 个双节点 16 卡 home -> 2 个单节点 8 卡 donor guest
    #     - {home: policy_2, donor: policy_1,
    #        home_replicas_per_unit: 1, guest_replicas_per_unit: 2}
    pairs: []
    guest_replica_rank_offset: 10000  # 保证 guest 的 vLLM actor 名全局唯一

# Shared rollout/framework wiring: n/top_p are projected into the per-policy
# configs below; agent/custom.* are consumed by the outer trainer only.
actor_rollout_ref:
  rollout:
    # GRPO group size: rollouts per prompt, shared by all policies (interpolated below).
    n: 4
    # Temperature is per-policy (policies.*.ppo_trainer_overrides.actor_rollout_ref
    # .rollout.temperature); the runner does not send it, so sampling uses each
    # policy's vLLM generation config, matching the log-prob recompute.
    top_p: 1.0

    agent:
      # Extension-point contract for the agent loop manager class.
      agent_loop_manager_class: uni_agent.trainer.framework.entry.AgentFrameworkRolloutAdapter

    custom:
      agent_framework:
        # Framework implementation driving the external multi-agent blackbox.
        framework_class_fqn: examples.multi_agent_blackbox.framework.RemoteMultiAgentFramework
        # Blackbox MAS client run once per prompt/rollout (role-gateway calls).
        multi_agent_runner_fqn: examples.multi_agent_blackbox.multi_agent_runner.multi_agent_runner
        # Number of gateway actors serving the LLM sessions.
        gateway_count: 8
        # Seconds to wait for a rollout batch to finish before failing it.
        completion_timeout_seconds: 600
        # Cap on concurrent in-flight rollouts (semaphore).
        max_concurrent_rollouts: 32
        multi_agent_runner_kwargs:
          # MAS topology/system-prompt config loaded by the runner.
          mas_config_path: examples/multi_agent_blackbox/config/mas_config_long.yaml
          # Default max_tokens per LLM call (agent_cfg in mas_config can override).
          max_tokens: 4096
          # Per-HTTP-request timeout inside the runner.
          request_timeout_seconds: 600
        # MAS role -> trainable policy attribution; the last role in this
        # ordering supplies the final result used for reward.
        role_policy_mapping:
          agent_1: policy_1
          agent_2: policy_1
          agent_3: policy_2

policies:
  # ── policies 字段所有权约定 ─────────────────────────────────────────
  # 未标注的字段 = per-policy 独立，可自由调整（每个 policy 可以不同）。
  # 标注"外层共享"的字段 = 顶层配置的投影，勿在此修改；要改请改顶层。
  # ⚠️ algorithm.* 不要改成字面值——合并 advantage 计算只读 policy_1 的配置，
  #    per-policy 分叉当前不支持（会静默不一致）。
  # 完整字段修改指南见 examples/multi_agent_blackbox/README.md。
  policy_1:
    # verl 配置名：ppo_trainer 或 ppo_megatron_trainer（从 verl.trainer.config 模块加载）。
    ppo_trainer_config_name: ppo_trainer
    ppo_trainer_overrides:
      trainer:
        nnodes: 2
        n_gpus_per_node: 8
        default_local_dir: checkpoints/multi_agent_blackbox/policy_1
        total_training_steps: ${trainer.total_training_steps}  # 外层共享，改顶层
        use_v1: true
        v1:
          trainer_mode: ${trainer.v1.trainer_mode}             # 外层共享，改顶层
          separate_async:
            parameter_sync_step: ${trainer.v1.separate_async.parameter_sync_step}  # 外层共享，改顶层
          sampler:
            sync_refill_failed_groups: ${sampler.sync_refill_failed_groups}  # 外层共享，改顶层

      data:
        train_batch_size: ${data.train_batch_size}             # 外层共享，改顶层

      algorithm:
        # 以下全部外层共享：改顶层 algorithm
        adv_estimator: ${algorithm.adv_estimator}
        gamma: ${algorithm.gamma}
        lam: ${algorithm.lam}
        use_kl_in_reward: ${algorithm.use_kl_in_reward}
        filter_groups: ${algorithm.filter_groups}

      reward:
        # 以下全部外层共享：改顶层 reward
        num_workers: ${reward.num_workers}
        custom_reward_function:
          path: ${reward.custom_reward_function.path}
          name: ${reward.custom_reward_function.name}

      actor_rollout_ref:
        hybrid_engine: true
        model:
          path: ???                                            # 必须 hydra override 提供（见文件头）
          trust_remote_code: true

        actor:
          strategy: fsdp
          use_dynamic_bsz: true
          ppo_mini_batch_size: 4                               # train_batch_size/parameter_sync_step 须能被其整除（当前 4/1/4）
          ppo_max_token_len_per_gpu: 40960
          use_kl_loss: false
          kl_loss_coef: 0.0
          optim:
            lr: 1e-6
            weight_decay: 0.01
          fsdp_config:
            fsdp_size: 8                                       # FSDP 分片数；须整除训练总卡数（nnodes×n_gpus_per_node）
            param_offload: true
            optimizer_offload: true

        rollout:
          name: vllm
          mode: async
          checkpoint_engine:
            backend: nccl
            # NCCL collective group name must be unique per policy (Ray derives
            # the detached NCCLUniqueIDStore actor name from the group key).
            engine_kwargs:
              nccl:
                group_name: checkpoint_policy_1
          n: ${actor_rollout_ref.rollout.n}
          # Standalone rollout replica allocation (separate_async): each replica
          # spans nnodes × n_gpus_per_node GPUs; launch scripts override per env.
          nnodes: 1
          n_gpus_per_node: 8
          # Per-policy sampling temperature == training-side recompute
          # temperature for this policy (fallback used by vLLM generation
          # config when the runner request carries no temperature).
          temperature: 1.0
          top_p: ${actor_rollout_ref.rollout.top_p}            # 外层共享，改顶层
          prompt_length: 4096
          response_length: 32768
          max_model_len: 36864
          load_format: safetensors
          tensor_model_parallel_size: 4                        # 须与 rollout 卡数匹配
          gpu_memory_utilization: 0.6
          calculate_log_probs: true
          enable_sleep_mode: true
          free_cache_engine: true
          multi_turn:
            format: qwen3_coder

  policy_2:
    # 结构与 policy_1 相同；字段所有权注释见 policy_1（下面同样适用）。
    # verl 配置名：ppo_trainer 或 ppo_megatron_trainer（从 verl.trainer.config 模块加载）。
    ppo_trainer_config_name: ppo_trainer
    ppo_trainer_overrides:
      trainer:
        nnodes: 2
        n_gpus_per_node: 8
        default_local_dir: checkpoints/multi_agent_blackbox/policy_2
        total_training_steps: ${trainer.total_training_steps}  # 外层共享，改顶层
        use_v1: true
        v1:
          trainer_mode: ${trainer.v1.trainer_mode}             # 外层共享，改顶层
          separate_async:
            parameter_sync_step: ${trainer.v1.separate_async.parameter_sync_step}  # 外层共享，改顶层
          sampler:
            sync_refill_failed_groups: ${sampler.sync_refill_failed_groups}  # 外层共享，改顶层

      data:
        train_batch_size: ${data.train_batch_size}             # 外层共享，改顶层

      algorithm:
        # 以下全部外层共享：改顶层 algorithm
        adv_estimator: ${algorithm.adv_estimator}
        gamma: ${algorithm.gamma}
        lam: ${algorithm.lam}
        use_kl_in_reward: ${algorithm.use_kl_in_reward}
        filter_groups: ${algorithm.filter_groups}

      reward:
        # 以下全部外层共享：改顶层 reward
        num_workers: ${reward.num_workers}
        custom_reward_function:
          path: ${reward.custom_reward_function.path}
          name: ${reward.custom_reward_function.name}

      actor_rollout_ref:
        hybrid_engine: true
        model:
          path: ???                                            # 必须 hydra override 提供（见文件头）
          trust_remote_code: true

        actor:
          strategy: fsdp
          use_dynamic_bsz: true
          ppo_mini_batch_size: 4                               # train_batch_size/parameter_sync_step 须能被其整除（当前 4/1/4）
          ppo_max_token_len_per_gpu: 40960
          use_kl_loss: false
          kl_loss_coef: 0.0
          optim:
            lr: 1e-6
            weight_decay: 0.01
          fsdp_config:
            fsdp_size: 8                                       # FSDP 分片数；须整除训练总卡数（nnodes×n_gpus_per_node）
            param_offload: true
            optimizer_offload: true

        rollout:
          name: vllm
          mode: async
          checkpoint_engine:
            backend: nccl
            # Must be unique per policy (must differ from policy_1's value).
            engine_kwargs:
              nccl:
                group_name: checkpoint_policy_2
          n: ${actor_rollout_ref.rollout.n}
          # Standalone rollout replica allocation (separate_async): each replica
          # spans nnodes × n_gpus_per_node GPUs; launch scripts override per env.
          nnodes: 1
          n_gpus_per_node: 8
          # Per-policy sampling temperature == training-side recompute
          # temperature for this policy (fallback used by vLLM generation
          # config when the runner request carries no temperature).
          temperature: 1.0
          top_p: ${actor_rollout_ref.rollout.top_p}            # 外层共享，改顶层
          prompt_length: 4096
          response_length: 32768
          max_model_len: 36864
          load_format: safetensors
          tensor_model_parallel_size: 8                        # 须与 rollout 卡数匹配
          gpu_memory_utilization: 0.6
          calculate_log_probs: true
          enable_sleep_mode: true
          free_cache_engine: true
          multi_turn:
            format: hermes
